<div id="pagina">
  <mat-form-field>
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>
  
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>
  
      <!-- Coluna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.id}} </td>
      </ng-container>
  
      <!-- Coluna Colaborador -->
      <ng-container matColumnDef="colaborador">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Colaborador </th>
        <td mat-cell *matCellDef="let row"> {{row.colaborador}} </td>
      </ng-container>
  
      <!-- Coluna Descrição -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
        <td mat-cell *matCellDef="let row"> {{row.descricao}} </td>
      </ng-container>
  
        <!-- Coluna Status -->
        <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let row"> {{row.status}} </td>
      </ng-container>
  
      <!-- Coluna Criação -->
      <ng-container matColumnDef="criacao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Criação </th>
        <td mat-cell *matCellDef="let row"> {{row.criacao}} </td>
      </ng-container>
  
      <!-- Coluna Atualização -->
      <ng-container matColumnDef="atualizacao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Atualização </th>
        <td mat-cell *matCellDef="let row"> {{row.atualizacao}} </td>
      </ng-container>
  
      <!-- Coluna Ação -->
      <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ação </th>
        <td mat-cell *matCellDef="let row"> {{row.acao}} </td>
      </ng-container>
  
      <tr id="colunaHeader" mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Sem informação correspondente a "{{input.value}}"</td>
      </tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10]" aria-label="Select page of users"></mat-paginator>
  </div>

</div>
