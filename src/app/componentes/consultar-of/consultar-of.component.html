<div id="pagina">
  <mat-form-field appearance="outline">
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>
  
      <!-- Coluna ID -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.codigo}} </td>
      </ng-container>
  
      <!-- Coluna Colaborador -->
      <ng-container matColumnDef="collaborator">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Colaborador </th>
        <td mat-cell *matCellDef="let row"> {{row.collaborator}} </td>
      </ng-container>
  
      <!-- Coluna Descrição -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
        <td mat-cell *matCellDef="let row"> {{row.description}} </td>
      </ng-container>
  
        <!-- Coluna Status -->
        <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let row"> {{row.status}} </td>
      </ng-container>
  
      <!-- Coluna Criação -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Criação </th>
        <td mat-cell *matCellDef="let row"> {{row.created_at | date:'dd/MM/yyyy'}} </td>
      </ng-container>
  
      <!-- Coluna Atualização -->
      <ng-container matColumnDef="updated_at">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Atualização </th>
        <td mat-cell *matCellDef="let row"> {{row.updated_at | date:'dd/MM/yyyy'}} </td>
      </ng-container>
  
      <!-- Coluna Ação -->
      <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ação </th>
        <td mat-cell *matCellDef="let row">
          <a (click)="listarPorId(row.codigo)">
            <img src="botaoEditar.png" alt="">
          </a>
          <a (click)="this.excluir(row.codigo)">
            <img src="botaoDeletar.png" alt="">
          </a>
        </td>
      </ng-container>
  
      <tr id="colunaHeader" mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Sem informação correspondente a "{{input.value}}"</td>
      </tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
